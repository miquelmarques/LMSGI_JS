<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Endevina el Número</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <header>
        <div>
            <h2>Número d'intents</h2>
            <input type="number" min="1" max="20" id=nintents>
            <button onclick="guardarIntents()" class="btn">Guardar</button>
        </div>
        <button class="btn">Reinicia!</button>
    </header>
    <main class="zona-principal">
        <section>
            <h2>Endevina el número entre 1 i 100!</h2>
            <article class="zona-joc">
                <div>
                    <input class="guess" type="number" min="1" max="100" id="numeroIntroduit">
                    <button onclick="jugar()" class="btn">Prova</button>
                </div>
                <div>
                    <p id="IntentsRestants">Intents restants: 0</p>
                </div>
            </article>
            <p class="zona-missatge" id="missatge">Comencem la partida!!</p>

        </section>
    </main>
</body>

</html>
